<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Shared entrance photo — SecurityAI</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
  :root{--bg:#14171A;--panel:#1C2124;--line:#353D43;--text:#EDEFF1;--muted:#A3ABB3;--red:#FF6B6B;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:720px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--muted);font-size:14px;}
  h1{font-size:21px;line-height:1.3;margin:0 0 4px;}
  .when{color:var(--muted);}
  .card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;overflow:hidden;}
  .card .b{padding:14px 16px 18px;}
  figure{margin:0;background:#0c0e10;}
  figure img{display:block;width:100%;height:auto;}
  figure + figure{border-top:1px solid var(--line);}
  figcaption{font-size:13px;color:var(--muted);padding:4px 10px 8px;}
  .said{margin:12px 0 0;}
  .said b{display:block;font-size:14px;color:var(--muted);font-weight:600;}
  .foot{color:var(--muted);font-size:14px;margin-top:14px;}
  .clock{font-size:13px;color:var(--muted);padding:6px 10px 8px;background:#0c0e10;}
  .open{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;margin-top:14px;border-radius:10px;border:1px solid var(--line);background:#242B30;color:var(--text);font-weight:600;text-decoration:none;}
  .msg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 16px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <svg width="24" height="24" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M4 18V6a2 2 0 0 1 2-2h12M44 18V6a2 2 0 0 0-2-2H30M4 30v12a2 2 0 0 0 2 2h12M44 30v12a2 2 0 0 1-2 2H30" stroke="#EDEFF1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="24" r="5.5" fill="#3FCF8E"/></svg>
    <span id="who">Shared from SecurityAI</span>
  </div>
  <div id="out"><div class="msg">Loading…</div></div>
</div>
<script>
// One incident shared by a gym. The link's token is the only key: it
// opens this entry and its photos, nothing else, and stops working after
// 7 days — or sooner, when the photos are deleted (the server sends the
// real expiry).
function esc(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
const token = location.pathname.split('/').filter(Boolean).pop() || new URLSearchParams(location.search).get('t') || '';
function headline(e){
  const n = e.people, exp = e.expected || 1;
  if(e.kind === 'flag') return n == null ? 'More people came in than expected' : (n - exp === 1 && exp === 1 ? 'Someone may have followed a member in' : `${n} people came in, ${exp} expected`);
  if(e.kind === 'possible') return n == null ? 'Maybe more than one person — not certain' : `Maybe ${n} people came in — not certain`;
  if(e.kind === 'unchecked') return 'Entry to check';
  if(e.kind === 'gate') return 'Accessible gate used';
  return n == null ? 'Entrance photo' : n === 1 ? '1 person came in' : `${n} people came in`;
}
(async () => {
  const out = document.getElementById('out');
  let r;
  try { r = await fetch('/gym/shared/' + encodeURIComponent(token)); } catch (e) {
    out.innerHTML = '<div class="msg">Can’t reach SecurityAI right now. Try again in a minute.</div>'; return;
  }
  const d = await r.json().catch(() => ({}));
  if(!r.ok){ out.innerHTML = `<div class="msg"><strong>This link has expired.</strong><br><span style="color:var(--muted)">${esc(d.error || '')} Ask whoever sent it for a new one.</span></div>`; return; }
  const e = d.event;
  const opt = { weekday:'long', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', second:'2-digit', timeZoneName:'short' };
  const tzOpt = { timeZone: d.timeZone || undefined };
  const fmtIn = (iso, o) => { try { return new Date(iso).toLocaleString('en-US', Object.assign({}, tzOpt, o)); } catch (x) { return new Date(iso).toLocaleString('en-US', o); } };
  const when = fmtIn(e.at, opt);
  const clock = d.cameraClockNote ? `<div class="clock">${esc(d.cameraClockNote)}</div>` : '';
  const exp = d.expiresAt ? fmtIn(d.expiresAt, { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', timeZoneName:'short' }) : null;
  // Only a same-site path is used as a link.
  const act = (typeof d.activityUrl === 'string' && /^\/activity\.html#ev-[A-Za-z0-9_%-]+$/.test(d.activityUrl)) ? d.activityUrl : null;
  if(d.gymName) document.getElementById('who').textContent = `Shared by ${d.gymName}`;
  document.title = `${d.gymName ? d.gymName + ': ' : ''}entrance, ${when}`;
  out.innerHTML = `<div class="card">
    <div class="b"><h1>${esc(headline(e))}</h1>
      <div class="when">${esc(when)}${e.zone ? ' · ' + esc(e.zone) : ''}</div>
      ${e.note ? `<p class="said"><b>What the camera saw</b>${esc(e.note)}</p>` : ''}
    </div>
    ${e.photos.map((u, i) => `<figure><img src="${esc(u)}" alt="Entrance photo ${i + 1} of ${e.photos.length}" loading="${i ? 'lazy' : 'eager'}">${i === 0 ? clock : ''}${e.photos.length > 1 ? `<figcaption>Photo ${i + 1} of ${e.photos.length}</figcaption>` : ''}</figure>`).join('')}
    </div>
    ${act ? `<a class="open" href="${esc(act)}">Open in your activity page</a>` : ''}
    <p class="foot">This link shows only this one entry and stops working ${exp ? 'on ' + esc(exp) : 'within 7 days'}, when ${d.expiresAt ? 'the link or the photos expire' : 'it expires'}. Press and hold a photo to save it.${act ? ' “Open in your activity page” needs your gym code.' : ''}</p>`;
})();
</script>
</body>
</html>
